# ==============================================================================
# # Cfp Demo Configuration
#
# - Comments start with `#` and run until the end of the line
# - Sections nest arbitrarily deep and are queried with `.` notation
# - A section is either *flat* (only properties) or *nested* (only sections)
# ==============================================================================

# Flat section: contains only properties

global {
    name = "cfp-demo"
    port = 8080                        # inline comments work after bare values
    verbose = true
    build_number = -7                  # numbers are signed (`isize`)
    tags = ["core", "net", 42, true]   # lists may mix every scalar type
}

# Nested sections: sections containing other sections only

project {
    web {
        host_name = "example.com"
        shared_object = "../proj-1/zig-out/lib/lib-proj-1.so"
    }

    workers {
        count = 8
        names = ["alice", "bob", "carol"]
    }
}

# Runtime-known sections, enumerated with `Cfp.getSections()`

applet {
    proj_1 {
        host_name = "example.com"
        shared_object = "../proj-1/zig-out/lib/lib-proj-1.so"
    }

    proj_2 {
        host_name = "staging.example.com"
        shared_object = "../proj-2/zig-out/lib/lib-proj-2.so"
    }
}
